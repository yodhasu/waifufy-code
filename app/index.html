<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waifufy Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- Live2D Cubism Core must load before the engine. -->
<script src="/live2dcubismcore.min.js"></script>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="backdrop">
      <div class="window-light" style="left:520px"></div>
      <div class="window-light" style="left:740px"></div>
      <div class="window-light" style="left:960px"></div>
      <div class="ray" style="left:600px"></div>
      <div class="ray" style="left:820px"></div>
      <div class="ray" style="left:1040px"></div>
      <div class="floor"></div>
      <div id="petals"></div>
    </div>
    <!-- The character module owns #chara. -->
    <div id="chara"></div>
    <!-- One root per screen; each screen module builds its own content. -->
    <section class="screen" id="screen-title"></section>
    <section class="screen" id="screen-saves"></section>
    <section class="screen" id="screen-settings"></section>
    <section class="screen" id="screen-chat"></section>
    <section class="screen" id="screen-wizard"></section>

    <div class="overlay" id="confirm">
      <div class="box panel">
        <h3 id="confirmTitle"></h3>
        <p id="confirmBody"></p>
        <div class="row"><button class="btn" id="confirmNo"></button><button class="btn primary" id="confirmYes"></button></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="offline">Rem lost her connection to Claude Code… reconnecting</div>
  </div>
</div>
<input type="file" id="filePicker" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
