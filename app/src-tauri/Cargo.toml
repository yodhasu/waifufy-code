[package]
name = "waifufy-code"
version = "0.8.1"
edition = "2021"

[lib]
name = "waifufy_code_lib"
# The desktop binary only needs rlib: a cdylib built for windows-gnu fails to link ("export ordinal too large").
# The Android build adds staticlib and cdylib for its run (scripts/build-android.mjs).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# The desktop shell: the sidecar supervisor's error dialogs and the folder picker.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

# The phone app pairs with a desktop by scanning the QR code its Settings show.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
